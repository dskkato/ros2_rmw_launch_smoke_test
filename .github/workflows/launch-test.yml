name: ROS 2 Lyrical RMW launch test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ROS_DISTRO: lyrical
  ROS_RELEASE_TAG: release-lyrical-20260807
  ROS_ARCHIVE: ros2-lyrical-2026-08-07-windows-AMD64.zip

jobs:
  launch-test:
    name: launch test on Windows (three RMWs, one job)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download ROS 2 Lyrical archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ros2Prefix = Join-Path $env:RUNNER_TEMP 'ros2_lyrical'
          $releaseUrl = "https://github.com/ros2/ros2/releases/download/$env:ROS_RELEASE_TAG/$env:ROS_ARCHIVE"
          New-Item -ItemType Directory -Force -Path $ros2Prefix | Out-Null
          Invoke-WebRequest -Uri $releaseUrl -OutFile (Join-Path $ros2Prefix $env:ROS_ARCHIVE)
          Expand-Archive -Path (Join-Path $ros2Prefix $env:ROS_ARCHIVE) -DestinationPath $ros2Prefix -Force
          $ros2Root = Join-Path $ros2Prefix 'ros2-windows'
          "ROS2_ROOT=$ros2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PIXI_MANIFEST=$(Join-Path $ros2Root 'pixi.toml')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: ${{ runner.temp }}/ros2_lyrical/ros2-windows/pixi.toml
          run-install: false

      - name: Install pixi environment
        shell: cmd
        run: pixi install --manifest-path "%PIXI_MANIFEST%"

      - name: Prepare ROS 2 pixi environment
        shell: cmd
        run: |
          pixi run --manifest-path "%PIXI_MANIFEST%" python "%ROS2_ROOT%\preinstall_setup_windows.py"

      - name: Build package
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call "%ROS2_ROOT%\setup.bat"
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon build --merge-install --event-handlers console_direct+

      - name: Run launch test with Fast DDS
        shell: cmd
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call "%ROS2_ROOT%\setup.bat"
          call install\setup.bat
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test --merge-install --event-handlers console_direct+
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test-result --verbose

      - name: Run launch test with Cyclone DDS
        shell: cmd
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call "%ROS2_ROOT%\setup.bat"
          call install\setup.bat
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test --merge-install --event-handlers console_direct+
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test-result --verbose

      - name: Run launch test with Zenoh
        shell: cmd
        env:
          RMW_IMPLEMENTATION: rmw_zenoh_cpp
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call "%ROS2_ROOT%\setup.bat"
          call install\setup.bat
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test --merge-install --event-handlers console_direct+
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test-result --verbose

      - name: Upload colcon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            log/
            build\**\test_results\
          if-no-files-found: ignore
