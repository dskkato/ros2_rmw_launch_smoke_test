name: ROS 2 Lyrical RMW launch test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ROS_DISTRO: lyrical
  ROS_RELEASE_TAG: release-lyrical-20260807
  ROS_ARCHIVE: ros2-lyrical-2026-08-07-ubuntu2604-x86_64.tar.bz2

jobs:
  launch-test:
    name: launch test (${{ matrix.rmw }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        rmw:
          - rmw_fastrtps_cpp
          - rmw_cyclonedds_cpp
          - rmw_zenoh_cpp

    env:
      RMW_IMPLEMENTATION: ${{ matrix.rmw }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download ROS 2 Lyrical archive
        shell: bash
        run: |
          set -euo pipefail
          ros2_prefix="${RUNNER_TEMP}/ros2_lyrical"
          release_url="https://github.com/ros2/ros2/releases/download/${ROS_RELEASE_TAG}/${ROS_ARCHIVE}"
          mkdir -p "$ros2_prefix"
          curl --fail --location --retry 3 "$release_url" \
            --output "${RUNNER_TEMP}/${ROS_ARCHIVE}"
          tar --extract --bzip2 --file "${RUNNER_TEMP}/${ROS_ARCHIVE}" \
            --directory "$ros2_prefix"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/ros2/ros2/lyrical/pixi.toml" \
            --output "${RUNNER_TEMP}/ros2_lyrical/pixi.toml"
          echo "ROS2_ROOT=${ros2_prefix}/ros2-linux" >> "$GITHUB_ENV"
          echo "PIXI_MANIFEST=${ros2_prefix}/pixi.toml" \
            >> "$GITHUB_ENV"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: ${{ runner.temp }}/ros2_lyrical/pixi.toml

      - name: Install pixi environment
        shell: bash
        run: pixi install --manifest-path "$PIXI_MANIFEST"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          pixi run --manifest-path "$PIXI_MANIFEST" bash -c '
            set -euo pipefail
            source "$ROS2_ROOT/setup.bash"
            colcon build --merge-install --event-handlers console_direct+
          '

      - name: Run launch test
        shell: bash
        run: |
          set -euo pipefail
          pixi run --manifest-path "$PIXI_MANIFEST" bash -c '
            set -euo pipefail
            source "$ROS2_ROOT/setup.bash"
            source install/local_setup.bash
            colcon test --merge-install --event-handlers console_direct+
            colcon test-result --verbose
          '

      - name: Upload colcon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs-${{ matrix.rmw }}
          path: |
            log/
            build/**/test_results/
          if-no-files-found: ignore
