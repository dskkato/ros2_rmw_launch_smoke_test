name: ROS 2 Lyrical RMW launch test (Windows)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-test:
    name: launch test on Windows (three RMWs, one job)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: lyrical
          use-ros2-testing: true

      - name: Build package
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call C:\dev\lyrical\ros2-windows\setup.bat
          colcon build --merge-install --event-handlers console_direct+

      - name: Run launch test with Fast DDS
        shell: cmd
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call C:\dev\lyrical\ros2-windows\setup.bat
          call install\setup.bat
          colcon test --merge-install --event-handlers console_direct+
          set "TEST_EXIT=%ERRORLEVEL%"
          colcon test-result --verbose
          set "RESULT_EXIT=%ERRORLEVEL%"
          if not "%TEST_EXIT%"=="0" exit /b %TEST_EXIT%
          exit /b %RESULT_EXIT%

      - name: Run launch test with Cyclone DDS
        shell: cmd
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call C:\dev\lyrical\ros2-windows\setup.bat
          call install\setup.bat
          colcon test --merge-install --event-handlers console_direct+
          set "TEST_EXIT=%ERRORLEVEL%"
          colcon test-result --verbose
          set "RESULT_EXIT=%ERRORLEVEL%"
          if not "%TEST_EXIT%"=="0" exit /b %TEST_EXIT%
          exit /b %RESULT_EXIT%

      - name: Run launch test with Zenoh
        shell: cmd
        env:
          RMW_IMPLEMENTATION: rmw_zenoh_cpp
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call C:\dev\lyrical\ros2-windows\setup.bat
          call install\setup.bat
          colcon test --merge-install --event-handlers console_direct+
          set "TEST_EXIT=%ERRORLEVEL%"
          colcon test-result --verbose
          set "RESULT_EXIT=%ERRORLEVEL%"
          if not "%TEST_EXIT%"=="0" exit /b %TEST_EXIT%
          exit /b %RESULT_EXIT%

      - name: Upload colcon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            log/
            build\**\test_results\
          if-no-files-found: ignore
