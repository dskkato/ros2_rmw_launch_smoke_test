name: ROS 2 Lyrical RMW launch test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ROS_DISTRO: lyrical
  ROS_RELEASE_TAG: release-lyrical-20260807
  ROS_ARCHIVE: ros2-lyrical-2026-08-07-windows-AMD64.zip

jobs:
  launch-test:
    name: launch test on Windows (three RMWs, one job)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Cache ROS 2 Lyrical archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ros2_lyrical/${{ env.ROS_ARCHIVE }}
          key: ros2-${{ runner.os }}-${{ env.ROS_RELEASE_TAG }}-${{ env.ROS_ARCHIVE }}

      - name: Download ROS 2 Lyrical archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ros2Prefix = Join-Path $env:RUNNER_TEMP 'ros2_lyrical'
          $releaseUrl = "https://github.com/ros2/ros2/releases/download/$env:ROS_RELEASE_TAG/$env:ROS_ARCHIVE"
          $archivePath = Join-Path $ros2Prefix $env:ROS_ARCHIVE
          New-Item -ItemType Directory -Force -Path $ros2Prefix | Out-Null
          if (-not (Test-Path $archivePath)) {
            Invoke-WebRequest -Uri $releaseUrl -OutFile $archivePath
          } else {
            Write-Host "Using cached ROS 2 archive: $archivePath"
          }
          Expand-Archive -Path $archivePath -DestinationPath $ros2Prefix -Force
          $ros2Root = Join-Path $ros2Prefix 'ros2-windows'
          "ROS2_ROOT=$ros2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PIXI_MANIFEST=$(Join-Path $ros2Root 'pixi.toml')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable clang-tidy in pixi environment
        shell: pwsh
        run: |
          # Workaround for the archive dependency issue; revisit when updating
          # the ROS 2 release/archive: https://github.com/ros2/ros2/issues/1864
          $manifest = Get-Content -Raw -Path $env:PIXI_MANIFEST
          $oldDependency = 'clang-format = "==18.1.8"'
          $newDependency = 'clang-tools = "==18.1.8"'
          if (-not $manifest.Contains($oldDependency)) {
            throw "Could not find the pinned clang-format dependency in $env:PIXI_MANIFEST"
          }
          $manifest = $manifest.Replace($oldDependency, $newDependency)
          Set-Content -Path $env:PIXI_MANIFEST -Value $manifest -NoNewline

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: ${{ runner.temp }}/ros2_lyrical/ros2-windows/pixi.toml
          cache: false
          run-install: false

      - name: Cache pixi environment
        id: pixi-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ros2_lyrical/ros2-windows/.pixi
          key: pixi-${{ runner.os }}-${{ env.ROS_RELEASE_TAG }}-clang-tools-v1

      - name: Install pixi environment
        if: steps.pixi-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: pixi install --manifest-path "%PIXI_MANIFEST%"

      - name: Prepare ROS 2 pixi environment
        shell: cmd
        run: |
          pixi run --manifest-path "%PIXI_MANIFEST%" python "%ROS2_ROOT%\preinstall_setup_windows.py"

      - name: Patch ament_lint executable lookup on Windows
        shell: pwsh
        run: |
          # Workaround for the Windows executable lookup issue; revisit when
          # updating the ROS 2 release/archive: https://github.com/ament/ament_lint/issues/590
          $sitePackages = Join-Path $env:ROS2_ROOT 'Lib/site-packages'
          if (-not (Test-Path (Join-Path $sitePackages 'ament_clang_tidy/main.py'))) {
            throw "Could not find the ROS ament_lint Python packages in $sitePackages"
          }
          $patchFile = Join-Path $env:GITHUB_WORKSPACE '.github/patches/ament_lint-windows-executable-lookup.patch'
          Push-Location $sitePackages
          try {
            git apply --check -p1 $patchFile
            git apply -p1 $patchFile
          } finally {
            Pop-Location
          }

      - name: Build package
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call "%ROS2_ROOT%\setup.bat"
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon build --merge-install --event-handlers console_direct+ --cmake-args -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Windows tests with Fast DDS (skip launch test)
        shell: cmd
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call "%ROS2_ROOT%\setup.bat"
          call install\setup.bat
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test --merge-install --ctest-args -E "test_pub_sub_launch_cpp|test_pub_sub_launch" --event-handlers console_direct+
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test-result --verbose

      - name: Run Windows tests with Cyclone DDS (skip launch test)
        shell: cmd
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call "%ROS2_ROOT%\setup.bat"
          call install\setup.bat
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test --merge-install --ctest-args -E "test_pub_sub_launch_cpp|test_pub_sub_launch" --event-handlers console_direct+
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test-result --verbose

      - name: Run Windows tests with Zenoh (skip launch test)
        shell: cmd
        env:
          RMW_IMPLEMENTATION: rmw_zenoh_cpp
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          call "%ROS2_ROOT%\setup.bat"
          call install\setup.bat
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test --merge-install --ctest-args -E "test_pub_sub_launch_cpp|test_pub_sub_launch" --event-handlers console_direct+
          pixi run --manifest-path "%PIXI_MANIFEST%" colcon test-result --verbose

      - name: Upload colcon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            log/
            build\**\test_results\
          if-no-files-found: ignore
